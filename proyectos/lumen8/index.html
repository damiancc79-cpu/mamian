<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a cobalt handheld centered on a dark desk; screen on top, d-pad and A/B below (side by side on wide screens). */
:root{
  --room:#0e0f17; --room-glow:#1c2140;
  --shell:#2f4ac4; --shell-hi:#5a76ea; --shell-lo:#1b2b86;
  --bezel:#11121b; --pad:#171826; --pad-hi:#2a2c40;
  --btn-a:#e0406a; --btn-b:#f0b429;
  --ink:#eef0ff; --ink-dim:#b9c2f2; --ink-faint:#8d98d8;
  --display:'Silkscreen',ui-monospace,'Courier New',monospace;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 35%,var(--room-glow),var(--room) 70%) fixed,var(--room);color:var(--ink);font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow-x:hidden;min-height:100%}
.console{display:grid;grid-template-areas:"top" "screen" "ctrls" "opts";gap:14px;width:min(560px,100%);box-sizing:border-box;padding:16px 18px 20px;border-radius:22px 22px 64px 22px;background:linear-gradient(155deg,var(--shell-hi),var(--shell) 28%,var(--shell-lo));box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -6px 0 rgba(0,0,0,.28),0 30px 70px rgba(0,0,0,.55)}
.top{grid-area:top;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--ink-dim);text-transform:uppercase}
.brand{font-size:20px;font-weight:700;letter-spacing:.08em;color:var(--ink);text-shadow:0 2px 0 var(--shell-lo)}
.brand span{color:var(--btn-b)}
.power{display:flex;align-items:center;gap:8px}
.led{width:9px;height:9px;border-radius:50%;background:var(--btn-a);box-shadow:0 0 8px var(--btn-a)}
.led.pad{background:#5ce07a;box-shadow:0 0 8px #5ce07a}
.bezel{grid-area:screen;background:var(--bezel);border-radius:12px 12px 34px 12px;padding:14px 14px 8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.04)}
.screen{position:relative;width:min(100%,max(240px,calc((100vh - 370px)*4/3)));width:min(100%,max(240px,calc((100dvh - 370px)*4/3)));aspect-ratio:4/3;max-width:100%;margin:0 auto;border-radius:8px;overflow:hidden;background:#000}
.screen canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;filter:saturate(1.12) contrast(1.04);touch-action:none}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.26) 0,rgba(0,0,0,.26) 1px,transparent 1px,transparent 3px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%);box-shadow:inset 0 0 30px rgba(120,160,255,.18)}
.crt::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 40%);animation:flick 4s steps(30) infinite}
@keyframes flick{50%{opacity:.75}}
.screen.nocrt .crt{display:none}
.cart-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#07070f}
.bezel-label{font-family:var(--display);font-size:9px;letter-spacing:.2em;color:var(--ink-faint);text-align:center;margin-top:7px;text-transform:uppercase}
.ctrls{grid-area:ctrls;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-inline:4px;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--btn-b);outline-offset:3px}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
.dpad button,.dpad .hub{background:var(--pad);border:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.5),inset 0 2px 0 var(--pad-hi);color:var(--ink-faint);font-size:12px;padding:0}
.dpad .u{grid-area:1/2;border-radius:8px 8px 0 0}.dpad .l{grid-area:2/1;border-radius:8px 0 0 8px}
.dpad .r{grid-area:2/3;border-radius:0 8px 8px 0}.dpad .d{grid-area:3/2;border-radius:0 0 8px 8px}
.dpad .hub{grid-area:2/2;box-shadow:none;background:radial-gradient(circle,var(--pad-hi) 0 5px,var(--pad) 6px)}
.dpad button.on,.ab button.on,.mid button.on{transform:translateY(2px);filter:brightness(1.25)}
.mid{grid-area:mid;display:flex;flex-direction:column;gap:12px;align-items:center}
.mid button{width:58px;height:16px;border:0;border-radius:9px;background:var(--pad);box-shadow:inset 0 -2px 0 rgba(0,0,0,.5);font-family:var(--display);font-size:8px;letter-spacing:.14em;color:var(--ink-faint)}
.mid label{font-family:var(--display);font-size:8px;letter-spacing:.14em;color:var(--ink-dim);margin-top:-8px}
.ab{grid-area:ab;display:flex;gap:14px;align-items:center;transform:rotate(-22deg);padding:8px 10px;border-radius:40px;background:rgba(0,0,0,.14)}
.ab button{width:54px;height:54px;border-radius:50%;border:0;font-family:var(--display);font-weight:700;font-size:16px;color:rgba(0,0,0,.55);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.3)}
.ab .a{background:var(--btn-a);margin-top:-22px}.ab .b{background:var(--btn-b)}
.opts{grid-area:opts;display:flex;flex-direction:column;gap:10px;align-items:center}
.opts .row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.opts button{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.18);border-radius:999px;padding:5px 12px;font-family:var(--display);font-size:10px;letter-spacing:.1em;color:var(--ink)}
.opts button:hover{background:rgba(0,0,0,.3)}
.help{margin:0;font-size:11.5px;line-height:1.55;color:var(--ink-dim);text-align:center;max-width:60ch;text-wrap:balance}
.help a{color:var(--ink)}
.help kbd{font-family:var(--mono);font-size:10.5px;background:rgba(0,0,0,.25);border-radius:4px;padding:1px 5px;color:var(--ink)}
@media (max-width:400px){.dpad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px)}.ab button{width:46px;height:46px}.mid button{width:48px}}
@media (min-width:900px) and (orientation:landscape){
  .console{grid-template-areas:"top top top" "dpad screen ab" ". mid ." "opts opts opts";grid-template-columns:auto minmax(0,1fr) auto;align-items:center;column-gap:34px;width:min(1180px,100%);border-radius:44px;padding:20px 34px 22px}
  .ctrls{display:contents}
  .dpad{grid-area:dpad;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
  .ab{grid-area:ab}
  .mid{flex-direction:row;justify-self:center;gap:22px}
  .mid label{display:none}
  .screen{width:min(100%,max(240px,calc((100vh - 310px)*4/3)));width:min(100%,max(240px,calc((100dvh - 310px)*4/3)))}
}
@media (prefers-reduced-motion:reduce){.crt::after{animation:none}}
</style>

<main class="console" aria-label="Consola Lumen 8">
  <div class="top">
    <div class="power"><span class="led" id="led"></span><span id="padState">Encendida</span></div>
    <div class="brand">LUMEN<span>·</span>8</div>
  </div>
  <div class="bezel">
    <div class="screen" id="screen">
      <canvas id="scr" width="256" height="192" aria-label="Pantalla de juego"></canvas>
      <div class="crt"></div>
    </div>
    <div class="bezel-label">Matriz de puntos 256 × 192 · 8 bits</div>
  </div>
  <div class="ctrls">
    <div class="dpad" aria-label="Cruceta">
      <button class="u" data-btn="up" aria-label="Arriba">▲</button>

    <div class="mid">

    </div>
    <p class="help"><kbd>Flechas</kbd>/<kbd>WASD</kbd> mover · <kbd>Z</kbd>/<kbd>Espacio</kbd> = A · <kbd>X</kbd> = B · <kbd>Enter</kbd> = START (pausa) · <kbd>Esc</kbd> = SELECT (volver al menú). También funciona con mando.</p>
    <p class="help">Pesca 16-bit usa sonidos y música de <a href="https://github.com/SuperTux/supertux" target="_blank" rel="noopener">SuperTux</a>. Créditos: tecla <kbd>C</kbd> en el juego o <a href="pesca/CREDITS.md" target="_blank" rel="noopener">CREDITS.md</a>.</p>
  </div>
</main>

<script>
'use strict';
const W=256,H=192;
const cv=document.getElementById('scr'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;

/* ---------- paleta y gráficos ---------- */
const PAL={K:'#0b0b14',N:'#1d1b33',P:'#8a4fd0',p:'#4a2a6b',R:'#e0406a',O:'#f08a3c',Y:'#ffd25a',G:'#4fd66a',D:'#1f7a4a',B:'#3f8cff',b:'#1f4aa8',C:'#7fe3ff',W:'#f4f1ff',S:'#8b8aa8',s:'#4b4a68',T:'#6b4630',L:'#c9a27a'};
function makeSpr(rows){const h=rows.length,w=rows[0].length;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);}}return c;}
function flipSpr(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const x=f.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(c,0,0);return f;}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function frame(x,y,w,h,c){rect(x,y,w,1,c);rect(x,y+h-1,w,1,c);rect(x,y,1,h,c);rect(x+w-1,y,1,h,c);}
function spr(c,x,y){g.drawImage(c,Math.round(x),Math.round(y));}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hitbox=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* fuente 3x5 propia */
const FD={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111101101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101101111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
'.':'000000000000010',',':'000000000010100','!':'010010010000010','?':'110001010000010',':':'000010000010000','-':'000000111000000','+':'000010111010000','/':'001001010100100','>':'100010001010100','<':'001010100010001',"'":'010010000000000','(':'010100100100010',')':'010001001001010','*':'000101010101000','¡':'010000010010010','¿':'010000010100011','·':'000000010000000','=':'000111000111000'};
function text(s,x,y,c,sc,al){sc=sc||1;s=String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const w=s.length*4*sc-sc;if(al==='center')x-=Math.floor(w/2);else if(al==='right')x-=w;x=Math.round(x);y=Math.round(y);
  g.fillStyle=c||'#fff';for(let i=0;i<s.length;i++){const f=FD[s[i]];if(f){for(let p=0;p<15;p++)if(f[p]==='1')g.fillRect(x+(p%3)*sc,y+((p/3)|0)*sc,sc,sc);}x+=4*sc;}}
function tshadow(s,x,y,c,sc,al){sc=sc||1;text(s,x+sc,y+sc,'#0b0b14',sc,al);text(s,x,y,c,sc,al);}

/* ---------- sonido ---------- */
let AC=null,muted=false,NB=null;
function audioOn(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,vol,slide){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);v.gain.setValueAtTime(vol||0.05,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,vol){if(!AC||muted)return;try{if(!NB){NB=AC.createBuffer(1,AC.sampleRate*0.5|0,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=AC.currentTime,s=AC.createBufferSource(),v=AC.createGain();s.buffer=NB;v.gain.setValueAtTime(vol||0.08,t);v.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(v);v.connect(AC.destination);s.start(t);s.stop(t+d);}catch(e){}}
const seq=(notes,gap,d,type,vol)=>notes.forEach((f,i)=>setTimeout(()=>tone(f,d,type,vol),i*gap));
const SFX={blip:()=>tone(660,0.05,'square',0.035),ok:()=>seq([523,784],70,0.09,'square',0.04),jump:()=>tone(300,0.15,'square',0.035,700),
  coin:()=>seq([988,1319],50,0.08,'square',0.035),hurt:()=>tone(240,0.28,'sawtooth',0.05,60),stomp:()=>tone(200,0.12,'square',0.05,80),
  shoot:()=>tone(900,0.04,'square',0.015,450),boom:()=>noise(0.35,0.1),pop:()=>noise(0.08,0.05),power:()=>seq([523,659,784,1047],60,0.08,'square',0.04),
  swap:()=>tone(440,0.06,'triangle',0.06,560),bad:()=>tone(170,0.15,'square',0.035,120),match:c=>tone(523*Math.pow(1.122,Math.min(c,8)),0.14,'triangle',0.07),
  tick:()=>tone(1200,0.02,'square',0.015),chime:()=>seq([392,523,659,784,1047],90,0.3,'triangle',0.05),
  over:()=>seq([392,330,262,196],160,0.22,'square',0.04),win:()=>seq([523,659,784,1047,784,1047],110,0.14,'square',0.04)};

/* ---------- entrada: teclado, pantalla táctil y mando ---------- */
const BTNS=['up','down','left','right','a','b','start','select'];
const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',Space:'a',KeyJ:'a',KeyX:'b',KeyK:'b',Enter:'start',KeyP:'start',Escape:'select',Backspace:'select'};
const src={key:{},touch:{},pad:{},tap:{}},held={},pr={},prev={};
addEventListener('keydown',e=>{const b=KEYS[e.code];if(b){if(!src.key[b])src.tap[b]=true;src.key[b]=true;e.preventDefault();}audioOn();});
addEventListener('keyup',e=>{const b=KEYS[e.code];if(b){src.key[b]=false;e.preventDefault();}});
addEventListener('blur',()=>{src.key={};src.touch={};});
document.querySelectorAll('[data-btn]').forEach(el=>{const b=el.dataset.btn;
  const on=e=>{e.preventDefault();audioOn();src.touch[b]=true;el.classList.add('on');try{el.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{src.touch[b]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,off));
  el.addEventListener('contextmenu',e=>e.preventDefault());});
function pollPad(){const P={};let gps=[];try{gps=navigator.getGamepads?Array.from(navigator.getGamepads()):[];}catch(e){}
  for(const gp of gps){if(!gp)continue;const B=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
    P.up=P.up||B(12)||ay<-0.5;P.down=P.down||B(13)||ay>0.5;P.left=P.left||B(14)||ax<-0.5;P.right=P.right||B(15)||ax>0.5;
    P.a=P.a||B(0);P.b=P.b||B(1)||B(2);P.start=P.start||B(9);P.select=P.select||B(8);}
  src.pad=P;}
function pollInput(){pollPad();for(const b of BTNS){const h=!!(src.key[b]||src.touch[b]||src.pad[b]||src.tap[b]);src.tap[b]=false;pr[b]=h&&!prev[b];held[b]=h;prev[b]=h;}}
const led=document.getElementById('led'),padState=document.getElementById('padState');
addEventListener('gamepadconnected',()=>{led.classList.add('pad');padState.textContent='Mando conectado';});
addEventListener('gamepaddisconnected',()=>{led.classList.remove('pad');padState.textContent='Encendida';});

/* récords locales */
let HI={};try{HI=JSON.parse(localStorage.getItem('lumen8-hi')||'{}')||{};}catch(e){HI={};}
function saveHi(){try{localStorage.setItem('lumen8-hi',JSON.stringify(HI));}catch(e){}}

/* partículas compartidas */
function burst(arr,x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*(sp||2.5)+0.4;arr.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:16+Math.random()*20|0,c:cols[i%cols.length]});}}
function stepParts(arr,grav){for(let i=arr.length-1;i>=0;i--){const q=arr[i];q.x+=q.vx;q.y+=q.vy;q.vy+=grav||0;q.vx*=0.96;if(--q.l<=0)arr.splice(i,1);}}
function drawParts(arr,ox){for(const q of arr)rect(q.x-(ox||0),q.y,q.l>8?2:1,q.l>8?2:1,q.c);}

/* =====================================================================
   CARTUCHO 1: BRINCO (plataformas)
   ===================================================================== */
const BRINCO=(()=>{
  const PL=[makeSpr(["....OOOO....","..OOOOOOOO..",".OOOOOOOOOO.",".OOWWOOWWOO.","OOOWKOOWKOOO","OOOWKOOWKOOO","OOOOOOOOOOOO","OOROOOOOOROO",".OOOORROOOO.",".OOOOOOOOOO.","..OOOOOOOO..","...OOOOOO...","..TT....TT..",".TTT....TTT."]),
            makeSpr(["....OOOO....","..OOOOOOOO..",".OOOOOOOOOO.",".OOWWOOWWOO.","OOOWKOOWKOOO","OOOWKOOWKOOO","OOOOOOOOOOOO","OOROOOOOOROO",".OOOORROOOO.",".OOOOOOOOOO.","..OOOOOOOO..","...OOOOOO...","...TT..TT...","...TTT.TTT.."])];
  const PLF=PL.map(flipSpr);
  const EN=[makeSpr(["...P....P...","..PPP..PPP..",".PPPPPPPPPP.","PPWWPPPPWWPP","PPKWPPPPKWPP","PPPPPPPPPPPP","PPPWRWRWRPPP",".PPPPPPPPPP.","..KK....KK..",".KKK....KKK."]),
            makeSpr(["...P....P...","..PPP..PPP..",".PPPPPPPPPP.","PPWWPPPPWWPP","PPKWPPPPKWPP","PPPPPPPPPPPP","PPPWRWRWRPPP",".PPPPPPPPPP.","...KK..KK...","..KKK..KKK.."])];
  const ENF=EN.map(flipSpr);
  const HEART=makeSpr([".RR.RR.","RRWRRRR","RRRRRRR",".RRRRR.","..RRR..","...R..."]);
  const HEART0=makeSpr([".ss.ss.","sssssss","sssssss",".sssss.","..sss..","...s..."]);
  const C=(...r)=>{while(r.length<12)r.unshift('................');return r;};
  const G2='################';
  const CH={
    start:C('........ooo.....','.......=====....','................','..P.............',G2,G2),
    plain:C('..o..o..o..o....','..........e.....',G2,G2),
    coins:C('......oooo......','................','.....======.....','................','..oo........oo..',G2,G2),
    gap:C('......oooo......','................','................','######....######','######....######'),
    enemies:C('......ooo.......','......===.......','................','................','...e.......e....',G2,G2),
    stairs:C('......oooo......','......####......','.....######.....','....########....','...##########...',G2,G2),
    spikes:C('......ooo.......','.....=====......','................','.....^^^^^......',G2,G2),
    platforms:C('......ooo.......','................','.....---........','..........---...','................','###..........###','###..........###'),

const GEMAS=(()=>{
  const N=8,CS=20,BX=8,BY=18;
  const GC=[['#e0406a','#7a1a36','#ff9ab4'],['#ffd25a','#9a6a10','#fff1b0'],['#4fd66a','#1a6a3c','#b4f5c0'],['#3f8cff','#1a3e98','#b0d4ff'],['#b46aff','#52268e','#e2c4ff'],['#7fe3ff','#24809e','#e8fbff']];
  const A=Math.abs;
  const SH=[(x,y)=>A(x)+A(y)<=7.5,(x,y)=>x*x+y*y<=52,(x,y)=>A(x)<=6.5&&A(y)<=6.5&&A(x)+A(y)<=10.5,(x,y)=>y>=-6.5&&y<=6.5&&A(x)<=(y+7)*0.55,
            (x,y)=>A(y)<=6.5&&A(x)+A(y)*0.5<=7.6,(x,y)=>(A(x)<=2.5&&A(y)<=7.5)||(A(y)<=2.5&&A(x)<=7.5)||(A(x)+A(y)<=6)];
  function makeGem(i,white){const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
    const ins=(px,py)=>px>=0&&py>=0&&px<16&&py<16&&SH[i](px-7.5,py-7.5);
    for(let py=0;py<16;py++)for(let px=0;px<16;px++){if(!ins(px,py))continue;const edge=!ins(px-1,py)||!ins(px+1,py)||!ins(px,py-1)||!ins(px,py+1);
      const d=(px-7.5)+(py-7.5);x.fillStyle=white?'#f4f1ff':edge?GC[i][1]:d<-4?GC[i][2]:GC[i][0];x.fillRect(px,py,1,1);}
    if(!white){x.fillStyle='#ffffff';for(const [a,b] of [[5,5],[6,5],[5,6]])if(ins(a,b))x.fillRect(a,b,1,1);}return c;}
  const GEM=[0,1,2,3,4,5].map(i=>makeGem(i,false)),GEMW=[0,1,2,3,4,5].map(i=>makeGem(i,true));
  let gr,cx,cy,sel,ph,at,sa,sb,clr,score,combo,time,maxT,parts,pops,lvl,msg,over,lastLvl;
  const rnd=()=>Math.random()*6|0;
  function fill(){gr=[];for(let y=0;y<N;y++){gr.push([]);for(let x=0;x<N;x++){let t;do{t=rnd();}while((x>=2&&gr[y][x-1].t===t&&gr[y][x-2].t===t)||(y>=2&&gr[y-1][x].t===t&&gr[y-2][x].t===t));gr[y].push({t,oy:0,vy:0});}}}
  function matches(){const m=new Set();
    for(let y=0;y<N;y++){let run=1;for(let x=1;x<=N;x++){if(x<N&&gr[y][x].t>=0&&gr[y][x].t===gr[y][x-1].t)run++;else{if(run>=3)for(let k=x-run;k<x;k++)m.add(y*N+k);run=1;}}}
    for(let x=0;x<N;x++){let run=1;for(let y=1;y<=N;y++){if(y<N&&gr[y][x].t>=0&&gr[y][x].t===gr[y-1][x].t)run++;else{if(run>=3)for(let k=y-run;k<y;k++)m.add(k*N+x);run=1;}}}
    return m;}
  function swap(a,b){const t=gr[a.y][a.x];gr[a.y][a.x]=gr[b.y][b.x];gr[b.y][b.x]=t;}
  function hasMoves(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(const [dx,dy] of [[1,0],[0,1]]){const b={x:x+dx,y:y+dy};if(b.x>=N||b.y>=N)continue;
      swap({x,y},b);const ok=matches().size>0;swap({x,y},b);if(ok)return true;}return false;}
  function init(){do{fill();}while(!hasMoves());cx=3;cy=3;sel=null;ph='idle';at=0;score=0;combo=1;maxT=60*60;time=maxT;parts=[];pops=[];lvl=1;lastLvl=1;msg=null;over=false;}
  function beginSwap(a,b){sa=a;sb=b;ph='swap';at=0;sel=null;cx=b.x;cy=b.y;SFX.swap();}
  function startClear(m){clr=m;ph='clear';at=0;SFX.match(combo);const pts=m.size*10*combo;score+=pts;time=Math.min(maxT,time+m.size*24);
    let sx=0,sy=0;m.forEach(i=>{sx+=i%N;sy+=(i/N)|0;});pops.push({x:BX+(sx/m.size)*CS+CS/2,y:BY+(sy/m.size)*CS+6,s:(combo>1?'X'+combo+' ':'')+'+'+pts,t:40});
    lvl=1+Math.floor(score/1500);if(lvl>lastLvl){lastLvl=lvl;msg={s:'¡NIVEL '+lvl+'!',t:80};}}
  function collapse(){for(let x=0;x<N;x++){let w=N-1;for(let y=N-1;y>=0;y--){if(gr[y][x].t>=0){if(y!==w)gr[w][x]={t:gr[y][x].t,oy:(y-w)*CS,vy:0};w--;}}
      const gap=w+1;for(let y=w;y>=0;y--)gr[y][x]={t:rnd(),oy:-gap*CS,vy:0};}}
  function reshuffle(){const ts=[];gr.forEach(r=>r.forEach(c=>ts.push(c.t)));let tries=0;
    do{for(let i=ts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ts[i],ts[j]]=[ts[j],ts[i]];}ts.forEach((t,i)=>{gr[(i/N)|0][i%N]={t,oy:0,vy:0};});tries++;}
    while((matches().size>0||!hasMoves())&&tries<200);if(tries>=200)do{fill();}while(!hasMoves());msg={s:'MEZCLANDO...',t:70};}
  function tap(x,y){if(ph!=='idle'||over)return;const gx=Math.floor((x-BX)/CS),gy=Math.floor((y-BY)/CS);if(gx<0||gy<0||gx>=N||gy>=N)return;
    if(sel&&A(gx-sel.x)+A(gy-sel.y)===1)beginSwap(sel,{x:gx,y:gy});else if(sel&&sel.x===gx&&sel.y===gy){sel=null;SFX.blip();}else{sel={x:gx,y:gy};cx=gx;cy=gy;SFX.blip();}}
  function update(){at++;stepParts(parts,0.15);pops.forEach(q=>{q.t--;q.y-=0.4;});pops=pops.filter(q=>q.t>0);if(msg&&--msg.t<=0)msg=null;
    if(over)return;
    if(ph==='idle'){time-=1+(lvl-1)*0.2;
      if(time<=0){time=0;over=true;gameOver(score,false);return;}
      if(time<600&&at%60===0)SFX.tick();
      const d=pr.left?[-1,0]:pr.right?[1,0]:pr.up?[0,-1]:pr.down?[0,1]:null;
      if(sel){if(d){const tx=sel.x+d[0],ty=sel.y+d[1];if(tx>=0&&ty>=0&&tx<N&&ty<N)beginSwap(sel,{x:tx,y:ty});else SFX.bad();}else if(pr.a||pr.b){sel=null;SFX.blip();}}
      else{if(d){cx=clamp(cx+d[0],0,N-1);cy=clamp(cy+d[1],0,N-1);SFX.blip();}if(pr.a){sel={x:cx,y:cy};SFX.blip();}}}
    else if(ph==='swap'||ph==='back'){if(at>=8){swap(sa,sb);if(ph==='swap'){const m=matches();if(m.size){combo=1;startClear(m);}else{ph='back';at=0;SFX.bad();}}else ph='idle';}}
    else if(ph==='clear'){if(at>=14){clr.forEach(i=>{const x=i%N,y=(i/N)|0;const t=gr[y][x].t;burst(parts,BX+x*CS+10,BY+y*CS+10,6,[GC[t][0],GC[t][2],'#f4f1ff'],2);gr[y][x].t=-1;});collapse();ph='fall';at=0;}}
    else if(ph==='fall'){let moving=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=gr[y][x];if(c.oy<0){c.vy+=0.5;c.oy+=c.vy;if(c.oy>=0){c.oy=0;c.vy=0;}else moving=true;}}
      if(!moving){const m=matches();if(m.size){combo++;startClear(m);}else{combo=1;if(!hasMoves())reshuffle();ph='idle';}}}}
  function draw(){rect(0,0,W,H,'#151230');for(let y=0;y<H;y+=8)for(let x=(y/8)%2*8;x<W;x+=16)rect(x,y,1,1,'#2a2552');
    rect(BX-3,BY-3,N*CS+6,N*CS+6,'#0b0b14');frame(BX-4,BY-4,N*CS+8,N*CS+8,'#4b4a68');
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)rect(BX+x*CS,BY+y*CS,CS,CS,(x+y)%2?'#231f45':'#1c1938');
    g.save();g.beginPath();g.rect(BX,BY,N*CS,N*CS);g.clip();
    const k=(ph==='swap'||ph==='back')?Math.min(1,at/8):0;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){const c=gr[y][x];if(c.t<0)continue;let px=BX+x*CS+2,py=BY+y*CS+2+c.oy;
      if(k){if(x===sa.x&&y===sa.y){px+=(sb.x-sa.x)*CS*k;py+=(sb.y-sa.y)*CS*k;}else if(x===sb.x&&y===sb.y){px+=(sa.x-sb.x)*CS*k;py+=(sa.y-sb.y)*CS*k;}}
      const fl=ph==='clear'&&clr.has(y*N+x);spr(fl&&(at>>1)%2?GEMW[c.t]:GEM[c.t],px,py);}
    g.restore();
    if(ph==='idle'&&!over){if(sel){frame(BX+sel.x*CS,BY+sel.y*CS,CS,CS,'#7fe3ff');frame(BX+sel.x*CS+1,BY+sel.y*CS+1,CS-2,CS-2,'#7fe3ff');}

    const hx=180;tshadow('GEMAS',hx+34,18,'#b46aff',2,'center');
    text('PUNTOS',hx,42,'#8b8aa8');tshadow(String(score),hx,50,'#f4f1ff',2);
    text('NIVEL',hx,72,'#8b8aa8');tshadow(String(lvl),hx,80,'#ffd25a',2);
    text('TIEMPO',hx,102,'#8b8aa8');rect(hx,110,68,7,'#0b0b14');const tr=time/maxT;rect(hx+1,111,Math.max(0,66*tr),5,tr<0.17?((at>>3)%2?'#e0406a':'#ff9ab4'):tr<0.4?'#ffd25a':'#4fd66a');

    text('A: COGER',hx,142,'#c8cbe8');text('FLECHA:',hx,150,'#c8cbe8');text('INTERCAMBIAR',hx,158,'#c8cbe8');text('O TOCA 2 GEMAS',hx,170,'#8b8aa8');
    if(msg)tshadow(msg.s,BX+N*CS/2,BY+N*CS/2-4,'#ffd25a',2,'center');}
  return {id:'gemas',name:'GEMAS',color:'#b46aff',desc:['INTERCAMBIA GEMAS Y HAZ LINEAS','DE 3. CADA COMBO TE DA TIEMPO.'],

function drawPause(){rect(0,0,W,H,'rgba(5,5,10,.65)');tshadow('PAUSA',W/2,70,'#f4f1ff',3,'center');
  text('START: SEGUIR',W/2,104,'#ffd25a',1,'center');text('B: SALIR AL MENU',W/2,116,'#c8cbe8',1,'center');}
function drawOver(){const o=S.ov;rect(0,0,W,H,'rgba(5,5,10,'+Math.min(0.72,o.t/40)+')');
  tshadow(o.win?'¡GANASTE!':'FIN DEL JUEGO',W/2,58,o.win?'#ffd25a':'#e0406a',o.win?3:2,'center');
  text('PUNTOS: '+o.score,W/2,90,'#f4f1ff',1,'center');
  if(o.rec&&(o.t>>4)%2===0)tshadow('¡NUEVO RECORD!',W/2,104,'#7fe3ff',1,'center');else if(!o.rec)text('RECORD: '+o.best,W/2,104,'#8b8aa8',1,'center');
  if(o.t>40){text('A: OTRA VEZ',W/2,130,'#ffd25a',1,'center');text('B: MENU',W/2,142,'#c8cbe8',1,'center');}}
function render(){
  if(S.mode==='ext'){rect(0,0,W,H,'#07070f');return;}
  if(S.mode==='boot')drawBoot();else if(S.mode==='menu'||S.mode==='insert')drawMenu();
  else{S.g.draw();if(S.mode==='pause')drawPause();else if(S.mode==='over')drawOver();}}

cv.addEventListener('pointerdown',e=>{audioOn();const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(S.mode==='boot'){if(S.t>40){SFX.ok();toMenu();}}
  else if(S.mode==='menu'){for(let i=0;i<NG;i++){const cx=CX(i);if(x>=cx&&x<cx+CW&&y>=20&&y<100){if(S.sel===i)insert();else{S.sel=i;SFX.blip();}}}}
  else if(S.mode==='play'&&S.g.tap)S.g.tap(x,y);
  else if(S.mode==='over'&&S.ov.t>40){SFX.ok();startGame(S.sel);}});

/* opciones */
const screenEl=document.getElementById('screen'),crtBtn=document.getElementById('crtBtn'),muteBtn=document.getElementById('muteBtn');
let prefs={crt:true,snd:true};try{Object.assign(prefs,JSON.parse(localStorage.getItem('lumen8-prefs')||'{}'));}catch(e){}
function applyPrefs(){screenEl.classList.toggle('nocrt',!prefs.crt);crtBtn.textContent='CRT: '+(prefs.crt?'sí':'no');muted=!prefs.snd;muteBtn.textContent='Sonido: '+(prefs.snd?'sí':'no');
  try{localStorage.setItem('lumen8-prefs',JSON.stringify(prefs));}catch(e){}}
crtBtn.addEventListener('click',()=>{prefs.crt=!prefs.crt;applyPrefs();crtBtn.blur();});
muteBtn.addEventListener('click',()=>{audioOn();prefs.snd=!prefs.snd;applyPrefs();muteBtn.blur();});
document.getElementById('fsBtn').addEventListener('click',e=>{e.currentTarget.blur();try{const el=document.querySelector('.console');const r=el.requestFullscreen&&el.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}catch(_){}});
applyPrefs();

/* bucle a 60 pasos por segundo */
let last=performance.now(),acc=0;const DT=1000/60;
function loop(now){acc+=Math.min(200,now-last);last=now;let n=0;while(acc>=DT&&n<5){step();acc-=DT;n++;}if(n===5)acc=0;render();requestAnimationFrame(loop);}
render();requestAnimationFrame(loop);
</script>

</body></html>
